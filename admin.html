<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Owner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <main class="max-w-3xl mx-auto p-4">
    <h1 class="text-lg font-bold mb-3">Payment approvals</h1>
    <form id="login" class="flex gap-2 mb-4">
      <input id="token" type="password" autocomplete="off" placeholder="Admin token" class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg">
      <button type="submit" class="px-4 py-2 text-sm font-semibold bg-indigo-600 text-white rounded-lg cursor-pointer">Open</button>
    </form>
    <p id="msg" class="text-sm text-rose-600 min-h-[1.25rem]" role="alert"></p>
    <section id="panel" class="hidden">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-sm font-bold">Waiting for approval</h2>
        <button id="reload" type="button" class="text-xs font-semibold text-indigo-700 cursor-pointer">Refresh</button>
      </div>
      <div id="pending" class="space-y-2 mb-6"></div>
      <h2 class="text-sm font-bold mb-2">Recent</h2>
      <div id="recent" class="space-y-2"></div>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
